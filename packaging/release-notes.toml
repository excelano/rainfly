# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.1.1"

[locales."en-us"]
whats-new = """
Times read correctly on a 24-hour clock: Dew likely by 23:00, not by 23.

In Fahrenheit and miles per hour, the checks now use the thresholds Settings shows, so a dew-point gap of 5° is checked as 5°. Each check writes its threshold as Settings does, and a forecast value close to it keeps a decimal, so the numbers no longer seem to contradict the verdict.

Widgets name your location My Location and redraw as soon as a change arrives from your other device. A camp you tap while a forecast is loading now gets its own forecast. Coordinates can be typed with a decimal comma, downloaded forecasts give their age in days once they are two days old, and the dew diary writes times as the main screen does and says which kind of morning it still needs for a suggestion.
"""
