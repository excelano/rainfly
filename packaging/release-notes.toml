# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.5"

[locales."en-us"]
whats-new = """
If you are up before the sun, the dew diary now asks what you found from two hours before sunrise, right on the overnight screen, and the morning reminder no longer comes once you have answered.

The red night screen now covers the top of the screen too, so the camp and settings buttons and the camp's name turn red with the rest on the iPhone and the watch. The diary's answer buttons and the watch's tent are also bright enough to read under the red.
"""
