# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.3"

[locales."en-us"]
whats-new = """
Frost now starts when the air is 2 °C (36 °F) or colder, not only below freezing. On a clear, calm night your tent cools a few degrees below the air around it, so it can frost over before the air freezes. Rainfly now calls those nights frost and allows the extra time it takes to dry.

The dew diary now also keeps how much of the sky is covered by low, middle and high cloud each hour, so Rainfly can learn which clouds stop dew from forming.
"""
