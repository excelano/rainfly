# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.8"

[locales."en-us"]
whats-new = """
The morning's packing call now follows the night the way the overnight screen does, judged with the settings you had at 22:00. Dew that dried before dawn reads as dry to pack rather than packing wet, drying in the dark counts toward the morning's dry time, and rain now gets a time when the tent should be dry. When Apple Weather's latest hours show dew, frost or rain the 22:00 call didn't expect, Last night now says so, rather than leaving a wet morning under a call for a dry night.

Tonight's night on the trip list now follows the night the way the main screen does: after 22:00 it looks only at the hours still ahead, and after sunrise it says whether the tent packs dry.

Overnight, Rainfly now looks only at the hours still ahead. A forecast revised for an hour that has already passed no longer shows as new since 22:00, no longer sends the overnight alert, and no longer changes the morning's account of how the forecast moved. The overnight answer also stays on while the rainfly is still wet from rain, dew or frost earlier in the night, and says what wet it.

Drying times now follow how much water the air can still take up, along with sun and wind, so a cold morning dries later than a warm one with the same gap to the dew point, and an overcast morning later than a clear one.

If you are up before the sun, the dew diary now asks what you found from two hours before sunrise, right on the overnight screen, and the morning reminder no longer comes once you have answered.

The red night screen now covers the top of the screen too, so the camp and settings buttons and the camp's name turn red with the rest on the iPhone and the watch. The diary's answer buttons and the watch's tent are also bright enough to read under the red.
"""
