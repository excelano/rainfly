# The copy the App Store listing is filled in from. Every line is a claim about
# the code, so it lives here, is reviewed and committed like anything else, and
# ship-appstore pushes it on every release. Edit here; do not edit the listing
# in a browser.
#
# Limits, counted in characters: apple.name and apple.subtitle 30,
# apple.promotional-text 170, apple.keywords 100 including the commas,
# description 4,000, apple-review-notes 4,000.

apple-review-notes = """
Zeltwetter is for people sleeping in a tent. It reads the overnight forecast for the campsite and says whether the rain fly should go on tonight, "Fly on" or "Fly off", with the reason. All of it runs on Apple Watch, so please review it there. The iOS app in the upload has no screens; it exists so that the watch app can be delivered through the App Store. Nothing has to be signed into, and there is no account.

Forecasts come from WeatherKit, so the watch needs a connection, through Wi-Fi, cellular or its iPhone, before the first verdict appears. A camp's forecast is kept on the watch after that.

TONIGHT'S VERDICT
Open Zeltwetter and allow Location while using the app. The main screen shows tonight's verdict for where the watch is, the reason for it, and how old the forecast is. Tap the verdict for the detail screen: each check (storms, overnight rain, wind-driven rain, dew or frost, morning rain, cold) with the time it fires, the night's low, the rain chance, and the Apple Weather mark with its legal link. With Location denied, a camp can still be added by search or coordinates and its verdict shown.

CAMPS AND TRIPS
The list button at the top left opens Camps. Add camp, then Search, finds campgrounds and towns; "Yosemite Valley" is a good one to try. Save it under any name and tap it for its verdict tonight. Add night assigns a camp to a later date, and Download trip fetches every planned night in the coming week, so those verdicts are there without a signal.

SETTINGS
The gear at the top right holds the units, the hour you plan to break camp, your sleeping bag's comfort rating, and every threshold the checks use. Each value turns with the Digital Crown.

THE OVERNIGHT PRESSURE WATCH
Once the first forecast has loaded, Zeltwetter asks to send notifications and for Motion & Fitness. Both serve one optional feature: during background refreshes at night it reads the watch's barometer for a few seconds, and when the pressure falls fast while the verdict is "Fly off", the watch raises a local notification. It needs a falling barometer at night, so it cannot be made to fire on demand. It can be turned off in Settings.

ON THE WATCH FACE
The complication shows tonight's verdict in the circular, corner, rectangular and inline families, and in the morning the time the tent should be dry.

WHERE DATA GOES
The coordinates of the camp being forecast go to WeatherKit, and to Apple's map service when a camp is searched for or named. Both requests go through Apple's frameworks; we run no server, and the app carries no analytics. Camps, forecasts, settings and the last twelve hours of pressure readings stay on the watch. Privacy policy: https://excelano.com/legal/#zeltwetter. Code: https://github.com/excelano/zeltwetter.
"""

[locales."en-us"]
website = "https://github.com/excelano/zeltwetter"
support = "https://github.com/excelano/zeltwetter"
privacy = "https://excelano.com/legal/#zeltwetter"
description = """
Zeltwetter answers one question at camp: should the rain fly go on tonight?

It reads the night's forecast for your campsite and gives a plain yes or no with the reason: "Dew likely by 4 AM", "Rain 35% after 2 AM", "Storms possible at 11 PM", or "Clear, dry, mild." In the morning it estimates when the tent will be dry enough to pack.

Every check stands on its own, and any one of them puts the fly on: thunderstorms, rain overnight, rain carried by strong wind, dew or frost on a clear and calm night, rain in the morning before you break camp, and a cold night. Tap the verdict to see each check and when it fires, with the night's low, the closest the air comes to its dew point, and the highest chance of rain. Zeltwetter also suggests opening the vents on a damp night with the fly on, and warns when the low falls below your sleeping bag's comfort rating.

Plan a trip and it follows you. Add camps by searching for a campground, park or town, from where you stand, or by entering coordinates with the Digital Crown. Plan which camp you sleep at each night, download the trip while you have signal, and each evening the watch shows that night's camp, with or without a connection.

Put the complication on your watch face to see the verdict at a glance, and the dry-by time in the morning. With the overnight pressure watch on, the watch reads its barometer through the night and taps you when the pressure falls fast while the fly is off. It samples a few times an hour, as watchOS allows, so it is an early hint rather than a weather station.

Every threshold can be changed, in °C or °F and m/s or mph.

There is no iPhone app to install: Zeltwetter lives on the watch. It asks for no account, shows no ads, sells nothing and tracks nothing, and its code is public under the MIT license.

Weather data is provided by Apple Weather.
"""

[locales."en-us".apple]
name = "Zeltwetter"
subtitle = "Rain fly on or off tonight?"
promotional-text = "Should the rain fly go on tonight? A yes or no for your campsite, with the reason and the time, plus when the tent will be dry in the morning. Plans a whole trip."
keywords = "tent,camping,backpacking,fly,dew,frost,condensation,campsite,forecast,weather,hiking,trip,outdoor"
